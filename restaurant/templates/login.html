<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ r.name }} — Нэвтрэх</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 100% at 50% 0%,#3a2c1b 0%,#241b12 45%,#16110c 100%);padding:20px}
.box{width:100%;max-width:360px;background:#f6f2ea;border-radius:22px;padding:36px 30px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.eyebrow{font-size:9px;font-weight:600;letter-spacing:.4em;text-transform:uppercase;color:#b08830;margin-bottom:8px}
h1{font-family:'Playfair Display',serif;font-size:26px;color:#211a12}
.sub{font-size:12px;color:#8a7f6d;margin:8px 0 24px}
input{width:100%;padding:13px 16px;border-radius:13px;border:1.5px solid #e8e0d1;background:#fffdf8;font-size:14px;font-family:inherit;margin-bottom:14px}
input:focus{outline:none;border-color:#b08830}
button{width:100%;padding:13px;border-radius:13px;border:none;background:#16110c;color:#f3e8cf;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
button:hover{background:#241b12}
.err{background:#f9e5da;color:#a04226;border:1px solid #efcbb8;border-radius:10px;padding:9px;font-size:12px;margin-bottom:14px}
.back{display:inline-block;margin-top:18px;font-size:12px;color:#8a7f6d;text-decoration:none}
.back:hover{color:#b08830}
</style>
</head>
<body>
<div class="box">
  <div class="eyebrow">{{ r.tagline }}</div>
  <h1>{{ r.name }}</h1>
  <div class="sub">Меню удирдлагад нэвтрэх</div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="err">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <input type="password" name="password" placeholder="Нууц үг" required autofocus>
    <button>Нэвтрэх</button>
  </form>
  <a class="back" href="/">← Меню рүү буцах</a>
</div>
</body>
</html>
