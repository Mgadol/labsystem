<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Нэвтрэх — Лабораторийн систем</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0ede8;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#1a2744;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
.lang-btns{display:flex;gap:4px}
.lang-btn{padding:4px 10px;border-radius:12px;font-size:11px;color:#93a8d4;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:.15s}
.lang-btn.active,.lang-btn:hover{border-color:#93a8d4;color:#fff}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:#fff;border:1px solid #e5e4e0;border-radius:14px;padding:32px;width:100%;max-width:360px}
.card-logo{text-align:center;margin-bottom:24px}
.logo-icon{width:52px;height:52px;background:#1a2744;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.card-title{font-size:18px;font-weight:600;color:#1a1a18;margin-bottom:4px}
.card-sub{font-size:13px;color:#6b6b67}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;color:#6b6b67;margin-bottom:5px}
.form-input{width:100%;padding:9px 12px;border:1px solid #e5e4e0;border-radius:8px;font-size:14px;font-family:inherit;transition:.15s}
.form-input:focus{outline:none;border-color:#1a2744}
.btn-login{width:100%;padding:10px;background:#1a2744;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s;margin-top:4px}
.btn-login:hover{background:#253561}
.error{background:#faece7;color:#993c1d;border:1px solid #f5c4b3;padding:9px 12px;border-radius:7px;font-size:13px;margin-bottom:14px}
.footer{text-align:center;padding:20px;font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#93a8d4" stroke-width="2"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/></svg>
    Лабораторийн систем
  </div>
  <div class="lang-btns">
    <a href="?lang=mn" class="lang-btn {% if session.get('lang','mn')=='mn' %}active{% endif %}">МОН</a>
    <a href="?lang=en" class="lang-btn {% if session.get('lang')=='en' %}active{% endif %}">ENG</a>
  </div>
</div>
<div class="center">
  <div class="card">
    <div class="card-logo">
      <img src="/static/{{ settings.logo }}" style="width:42px;height:64px;object-fit:contain;margin-bottom:8px">
      <div class="card-title">{{ settings.lab_name if session.get('lang','mn')=='mn' else settings.lab_name_en }}</div>
      <div class="card-sub" style="font-size:12px">Лабораторийн удирдлагын систем</div>
    </div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <input type="hidden" name="lang" value="{{ session.get('lang','mn') }}">
      <div class="form-group">
        <label class="form-label">{{ 'Нэвтрэх нэр' if session.get('lang','mn')=='mn' else 'Username' }}</label>
        <input type="text" name="employee_id" class="form-input" placeholder="" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">{{ 'Нууц үг' if session.get('lang','mn')=='mn' else 'Password' }}</label>
        <input type="password" name="password" class="form-input" required>
      </div>
      <button type="submit" class="btn-login">{{ 'Нэвтрэх' if session.get('lang','mn')=='mn' else 'Sign In' }}</button>
    </form>
    <div style="margin-top:18px;border-top:1px solid #e5e4e0;padding-top:14px">
      <div style="font-size:11px;color:#aaa;margin-bottom:8px;text-align:center">Зочны нэвтрэх код байгаа бол</div>
      <form method="GET" id="guestForm">
        <div style="display:flex;gap:6px">
          <input type="text" id="guestCode" class="form-input" placeholder="DEMO-XXXXXXXX"
            style="text-transform:uppercase;letter-spacing:1px;font-family:monospace;font-size:13px">
          <button type="button" onclick="guestLogin()"
            style="padding:9px 14px;background:#f0e6ff;color:#7C3AED;border:1px solid #c4b5fd;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap">
            👁 Харах
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
function guestLogin(){
  var code = document.getElementById('guestCode').value.trim().toUpperCase();
  if(!code){ alert('Кодоо оруулна уу'); return; }
  var token = code.startsWith('DEMO-') ? code.slice(5) : code;
  window.location.href = '/guest/' + token;
}
document.getElementById('guestCode').addEventListener('keydown', function(e){
  if(e.key==='Enter'){ e.preventDefault(); guestLogin(); }
});
</script>
<div class="footer">Лабораторийн тоног төхөөрөмжийн удирдлагын систем</div>
</body>
</html>
