<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a2744">
<title>Цайны газар — Меню</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a2744;--navy-light:#253561;
  --teal:#0f6e56;--teal-light:#e1f5ee;
  --coral:#993c1d;--coral-light:#faece7;
  --amber:#854f0b;--amber-light:#faeeda;
  --gray:#f7f7f5;--border:#e5e4e0;
  --text:#1a1a18;--text-muted:#6b6b67;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:#e8e5df}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#f5f3ef;display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(0,0,0,.12)}

/* ── Толгой ── */
.app-header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);color:#fff;padding:18px 18px 14px;position:sticky;top:0;z-index:50;border-radius:0 0 22px 22px}
.app-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.app-title{display:flex;align-items:center;gap:10px}
.app-title .emoji{font-size:26px}
.app-title h1{font-size:17px;font-weight:700;line-height:1.2}
.app-title small{font-size:11px;color:#93a8d4;font-weight:400;display:block}
.hdr-btn{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.hdr-btn:active{background:rgba(255,255,255,.25)}
/* Өдрийн chip-үүд */
.day-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-chip{flex:0 0 auto;width:52px;padding:8px 0;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid transparent;color:#c5cfe8;text-align:center;cursor:pointer;transition:.15s;font-family:inherit}
.day-chip .dw{font-size:10px;font-weight:500;opacity:.8}
.day-chip .dn{font-size:17px;font-weight:700;line-height:1.3}
.day-chip .dm{font-size:9px;opacity:.65}
.day-chip.today{border-color:#93a8d4}
.day-chip.sel{background:#fff;color:var(--navy)}
.day-chip.sel .dw,.day-chip.sel .dm{opacity:.7}
.day-chip .dot{width:4px;height:4px;border-radius:50%;background:#4ade80;margin:3px auto 0;visibility:hidden}
.day-chip.has .dot{visibility:visible}
.day-chip.sel .dot{background:var(--teal)}

/* ── Цайны цагийн таб ── */
.meal-tabs{display:flex;gap:8px;padding:14px 16px 4px;position:sticky;top:0;z-index:40}
.meal-tab{flex:1;padding:9px 4px;border-radius:14px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.meal-tab .mi{font-size:17px}
.meal-tab.sel{background:var(--navy);border-color:var(--navy);color:#fff}

/* ── Агуулга ── */
.content{flex:1;padding:12px 16px 96px}
.day-label{font-size:13px;font-weight:600;color:var(--text-muted);margin:6px 2px 10px}
.dish-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.dish-thumb{width:58px;height:58px;border-radius:14px;background:var(--gray);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
.dish-thumb img{width:100%;height:100%;object-fit:cover}
.dish-info{flex:1;min-width:0}
.dish-name{font-size:14px;font-weight:600;line-height:1.3}
.dish-desc{font-size:11.5px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dish-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.chip{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--gray);color:var(--text-muted)}
.chip.kcal{background:var(--amber-light);color:var(--amber)}
.dish-price{font-size:13px;font-weight:700;color:var(--teal);white-space:nowrap;align-self:flex-start;margin-top:2px}
.empty{text-align:center;padding:56px 20px;color:var(--text-muted)}
.empty .big{font-size:44px;margin-bottom:10px}
.empty p{font-size:13px}
.meal-summary{display:flex;justify-content:space-between;align-items:center;background:var(--teal-light);border-radius:14px;padding:10px 14px;margin:4px 0 14px;font-size:12px;font-weight:600;color:var(--teal)}

/* ── 7 хоногийн харагдац ── */
.week-day{background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px}
.week-day.today-card{border-color:var(--navy);box-shadow:0 2px 8px rgba(26,39,68,.12)}
.week-day-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.week-day-hd .d{font-size:13px;font-weight:700}
.week-day-hd .t{font-size:10px;font-weight:600;background:var(--navy);color:#fff;padding:2px 8px;border-radius:10px}
.week-meal{margin-top:8px}
.week-meal .m{font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:4px}
.week-meal .items{font-size:12.5px;line-height:1.6}
.week-empty{font-size:12px;color:var(--text-muted);font-style:italic}

/* ── Доод nav ── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:60}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:none;font-family:inherit;font-size:10px;font-weight:600;color:var(--text-muted);cursor:pointer;text-decoration:none;border-radius:12px}
.nav-item .ni{font-size:20px}
.nav-item.sel{color:var(--navy)}
.screen{display:none}.screen.on{display:block}
</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="app-header-top">
      <div class="app-title">
        <span class="emoji">🍽️</span>
        <h1>Цайны газар
          <small>Хүрэншанд уурхай — Хоолны меню</small>
        </h1>
      </div>
      <a href="{{ url_for('dashboard') }}" class="hdr-btn" title="Систем рүү буцах">✕</a>
    </div>
    <div class="day-strip" id="dayStrip"></div>
  </header>

  <!-- Өдрийн меню -->
  <div class="screen on" id="scr-day">
    <div class="meal-tabs" id="mealTabs">
      {% for code, name, icon in meals %}
      <button class="meal-tab{% if loop.first %} sel{% endif %}" data-meal="{{ code }}" onclick="selMeal('{{ code }}',this)">
        <span class="mi">{{ icon }}</span>{{ name }}
      </button>
      {% endfor %}
    </div>
    <div class="content">
      <div class="day-label" id="dayLabel"></div>
      <div id="dishList"></div>
    </div>
  </div>

  <!-- 7 хоногийн харагдац -->
  <div class="screen" id="scr-week">
    <div class="content" style="padding-top:16px">
      <div class="day-label">Долоо хоногийн меню</div>
      <div id="weekList"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item sel" id="nav-day" onclick="showScreen('day')"><span class="ni">🍛</span>Өнөөдөр</button>
    <button class="nav-item" id="nav-week" onclick="showScreen('week')"><span class="ni">📅</span>7 хоног</button>
    {% if session.get('role') in ('admin','senior') %}
    <a class="nav-item" href="{{ url_for('canteen_manage') }}"><span class="ni">⚙️</span>Удирдах</a>
    {% endif %}
    <a class="nav-item" href="{{ url_for('dashboard') }}"><span class="ni">🏠</span>Систем</a>
  </nav>
</div>

<script>
const MENU  = {{ menu | tojson }};
const DAYS  = {{ days | tojson }};
const TODAY = {{ today | tojson }};
const CATS  = {{ cats | tojson }};
const MEALS = {{ meals | tojson }};
const WD  = ['Ня','Да','Мя','Лх','Пү','Ба','Бя'];
const MON = ['1-р сар','2-р сар','3-р сар','4-р сар','5-р сар','6-р сар','7-р сар','8-р сар','9-р сар','10-р сар','11-р сар','12-р сар'];

let selDate = DAYS.includes(TODAY) ? TODAY : DAYS[0];
let selMealCode = MEALS[0][0];

function fmtPrice(p){
  if(p === null || p === undefined || p === '') return '';
  return Number(p).toLocaleString('en-US') + '₮';
}
function dObj(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function dayHasMenu(ds){
  const dm = MENU[ds];
  return dm && Object.values(dm).some(a => a.length);
}

/* Өдрийн chip-үүд */
function renderStrip(){
  const el = document.getElementById('dayStrip');
  el.innerHTML = '';
  DAYS.forEach(ds => {
    const d = dObj(ds);
    const b = document.createElement('button');
    b.className = 'day-chip' + (ds === TODAY ? ' today' : '') + (ds === selDate ? ' sel' : '') + (dayHasMenu(ds) ? ' has' : '');
    b.innerHTML = `<div class="dw">${WD[d.getDay()]}</div><div class="dn">${d.getDate()}</div><div class="dm">${d.getMonth()+1}-р сар</div><div class="dot"></div>`;
    b.onclick = () => { selDate = ds; renderStrip(); renderDay(); showScreen('day'); };
    el.appendChild(b);
  });
  const sel = el.querySelector('.day-chip.sel');
  if(sel) sel.scrollIntoView({inline:'center', block:'nearest'});
}

function selMeal(code, btn){
  selMealCode = code;
  document.querySelectorAll('.meal-tab').forEach(t => t.classList.toggle('sel', t === btn));
  renderDay();
}

function dishCard(dish){
  const cat = CATS[dish.category] || {icon:'🍽️', name:''};
  const thumb = dish.photo
    ? `<img src="/static/uploads/${dish.photo}" alt="" loading="lazy">`
    : cat.icon;
  return `<div class="dish-card">
    <div class="dish-thumb">${thumb}</div>
    <div class="dish-info">
      <div class="dish-name">${dish.name}</div>
      ${dish.desc ? `<div class="dish-desc">${dish.desc}</div>` : ''}
      <div class="dish-meta">
        <span class="chip">${cat.icon} ${cat.name}</span>
        ${dish.kcal ? `<span class="chip kcal">🔥 ${dish.kcal} ккал</span>` : ''}
      </div>
    </div>
    ${dish.price ? `<div class="dish-price">${fmtPrice(dish.price)}</div>` : ''}
  </div>`;
}

function renderDay(){
  const d = dObj(selDate);
  const rel = selDate === TODAY ? ' · Өнөөдөр' : '';
  document.getElementById('dayLabel').textContent =
    `${MON[d.getMonth()]} ${d.getDate()}, ${['Ням','Даваа','Мягмар','Лхагва','Пүрэв','Баасан','Бямба'][d.getDay()]} гараг${rel}`;
  const list = document.getElementById('dishList');
  const dishes = (MENU[selDate] || {})[selMealCode] || [];
  if(!dishes.length){
    list.innerHTML = `<div class="empty"><div class="big">🍳</div><p>Энэ өдрийн меню ороогүй байна</p></div>`;
    return;
  }
  const kcal = dishes.reduce((s,x) => s + (Number(x.kcal)||0), 0);
  let html = `<div class="meal-summary"><span>${dishes.length} төрлийн хоол</span>${kcal ? `<span>🔥 нийт ${kcal} ккал</span>` : ''}</div>`;
  html += dishes.map(dishCard).join('');
  list.innerHTML = html;
}

function renderWeek(){
  const el = document.getElementById('weekList');
  el.innerHTML = DAYS.map(ds => {
    const d = dObj(ds);
    const isToday = ds === TODAY;
    let inner = '';
    MEALS.forEach(([code, name, icon]) => {
      const dishes = (MENU[ds] || {})[code] || [];
      if(dishes.length){
        inner += `<div class="week-meal"><div class="m">${icon} ${name}</div><div class="items">${dishes.map(x=>x.name).join(' · ')}</div></div>`;
      }
    });
    if(!inner) inner = `<div class="week-empty">Меню ороогүй</div>`;
    return `<div class="week-day${isToday ? ' today-card' : ''}">
      <div class="week-day-hd">
        <span class="d">${MON[d.getMonth()]} ${d.getDate()} — ${['Ням','Даваа','Мягмар','Лхагва','Пүрэв','Баасан','Бямба'][d.getDay()]}</span>
        ${isToday ? '<span class="t">ӨНӨӨДӨР</span>' : ''}
      </div>${inner}</div>`;
  }).join('');
}

function showScreen(name){
  document.getElementById('scr-day').classList.toggle('on', name === 'day');
  document.getElementById('scr-week').classList.toggle('on', name === 'week');
  document.getElementById('nav-day').classList.toggle('sel', name === 'day');
  document.getElementById('nav-week').classList.toggle('sel', name === 'week');
  if(name === 'week') renderWeek();
}

renderStrip();
renderDay();
</script>
</body>
</html>
