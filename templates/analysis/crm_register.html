{% extends "partial/base.html" %}
{% block title %}CRM дээж бүртгэх{% endblock %}
{% block content %}
<style>
.crm-card{background:#fff;border-radius:12px;border:1px solid var(--border);padding:24px;max-width:560px}
.section-title{font-size:11px;font-weight:700;color:#7C3AED;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 10px;padding-bottom:4px;border-bottom:2px solid #ede9fe}
.cert-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>

<div class="page" style="max-width:580px">
  <div style="margin-bottom:16px">
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">
      <a href="{{ url_for('analysis') }}">Шинжилгээ</a> /
    </div>
    <h1 class="page-title">🔬 CRM дээж бүртгэх</h1>
    <p class="page-sub">Certified Reference Material — баталгаажсан стандарт дээж</p>
  </div>

  <div class="crm-card">
    <form method="POST">
      <div class="section-title">CRM мэдээлэл</div>
      <div class="form-group">
        <label class="form-label">CRM нэр <span style="color:var(--coral)">*</span></label>
        <input type="text" name="crm_name" class="form-input" required
          placeholder="Жишээ: SARM-19, GBW11107b"
          autofocus>
      </div>

      <div class="section-title">Батлагдсан утгууд</div>
      <div class="cert-grid">
        <div class="form-group">
          <label class="form-label">Mad [%]</label>
          <input type="number" name="crm_mad" class="form-input" step="0.01" min="0" max="100" placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">Aad [%]</label>
          <input type="number" name="crm_aad" class="form-input" step="0.01" min="0" max="100" placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">Vad [%]</label>
          <input type="number" name="crm_vad" class="form-input" step="0.01" min="0" max="100" placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">Sad [%]</label>
          <input type="number" name="crm_sulfur" class="form-input" step="0.001" min="0" max="10" placeholder="0.000">
        </div>
        <div class="form-group" style="grid-column:1/-1">
          <label class="form-label">Qb,ad [ккал/кг]</label>
          <input type="number" name="crm_cal" class="form-input" step="0.01" min="0" placeholder="0.00">
        </div>
      </div>

      <div class="section-title">Нэмэлт мэдээлэл</div>
      <div class="form-group">
        <label class="form-label">Огноо</label>
        <input type="date" name="collected_date" class="form-input" value="{{ today }}">
      </div>
      <div class="form-group">
        <label class="form-label">Тэмдэглэл</label>
        <textarea name="notes" class="form-input" rows="3" placeholder="Лот дугаар, эх үүсвэр болон бусад тэмдэглэл..."></textarea>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px">
        <a href="{{ url_for('analysis') }}" class="btn btn-ghost">← Буцах</a>
        <button type="submit" class="btn" style="background:#7C3AED;color:#fff;padding:8px 20px">🔬 CRM бүртгэх</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
