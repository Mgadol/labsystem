{% extends "partial/base.html" %}
{% block title %}CRM дээж бүртгэх{% endblock %}
{% block content %}
<div class="page" style="max-width:640px">
  <div style="margin-bottom:20px">
    <h1 class="page-title">🔬 CRM дээж бүртгэх</h1>
    <p class="page-sub">Certified Reference Material — Баталгаат лавлах дээж</p>
  </div>

  <div class="card">
    <form method="POST" action="{{ url_for('crm_register') }}">

      <div class="form-group">
        <label class="form-label">CRM нэр <span style="color:var(--coral)">*</span></label>
        <input type="text" name="crm_name" class="form-input" required
          placeholder="Жишээ: SARM-18, ACAL-1046...">
      </div>

      <div class="section-title" style="margin-top:20px">Батлагдсан утгууд (certified values)</div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Mad — Дотоод чийг (%)</label>
          <input type="number" name="crm_mad" class="form-input" step="0.01" min="0" max="100"
            placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">Aad — Үнслэг (%)</label>
          <input type="number" name="crm_aad" class="form-input" step="0.01" min="0" max="100"
            placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">Vad — Дэгдэмхий бодис (%)</label>
          <input type="number" name="crm_vad" class="form-input" step="0.01" min="0" max="100"
            placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">Sad — Нийт хүхэр (%)</label>
          <input type="number" name="crm_sulfur" class="form-input" step="0.001" min="0" max="10"
            placeholder="0.000">
        </div>
        <div class="form-group" style="grid-column:1/-1">
          <label class="form-label">Qb,ad — Илчлэг (ккал/кг)</label>
          <input type="number" name="crm_cal" class="form-input" step="1" min="0"
            placeholder="0">
        </div>
      </div>

      <div class="form-grid" style="margin-top:8px">
        <div class="form-group">
          <label class="form-label">Огноо <span style="color:var(--coral)">*</span></label>
          <input type="date" name="collected_date" class="form-input" value="{{ today }}" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Тэмдэглэл</label>
        <textarea name="notes" class="form-input" rows="3"
          placeholder="Нэмэлт мэдээлэл..."></textarea>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <a href="{{ url_for('analysis') }}" class="btn btn-ghost">← Буцах</a>
        <button type="submit" class="btn" style="background:#7C3AED;color:#fff">
          🔬 Бүртгэх
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
